<style>
:root{--n:#1b5e32;--g:#d4a017;--bg:#f6f4e6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--n)}
header{width:calc(100% - 32px);max-width:968px;margin:16px auto 0;background:linear-gradient(135deg,#1b5e32,#3a9140);color:#fff;padding:16px 20px;border-radius:18px;display:flex;align-items:center;gap:16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
header img{height:64px;width:auto;max-height:none;margin:0;border-radius:0}
header .tx{display:flex;flex-direction:column;gap:3px}
header small{color:var(--g);font-size:.5em;font-weight:700;letter-spacing:.12em}
header b{font-size:1.5em;line-height:1.1;text-transform:uppercase}
header i{font-style:normal;font-size:.75em;font-weight:400}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{margin:22px 0 8px;border-left:6px solid var(--g);padding-left:10px}
table{width:100%;border-collapse:collapse;background:#fff;margin-bottom:8px}
th{background:var(--n);color:#fff;text-align:left}
th,td{padding:8px 10px;border:1px solid #c9c4b3;vertical-align:top}
.w{overflow-x:auto}
input,select,button{font:inherit;padding:8px 12px;border:2px solid var(--n);border-radius:10px;background:#fff;color:var(--n)}
button{cursor:pointer;font-weight:700}.p{background:var(--n);color:#fff}
.lo{color:#b42323;font-weight:700}.bar{display:inline-block;height:10px;background:var(--g);border-radius:5px;vertical-align:middle}
.bar.r{background:#d64545}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}header~main button,select,#bar,p.so{display:none}body{background:#fff}header{box-shadow:none;width:auto;max-width:none;margin:0}tr{break-inside:avoid}main{max-width:none;padding:0}.w{overflow:visible}table{width:100%;font-size:11px}th,td{padding:4px 6px;overflow-wrap:anywhere}#rm th:last-child,#rm td:last-child{display:none}@page{size:A4 landscape;margin:10mm}}
@media(max-width:600px){body{font-size:14px}main{padding:10px}header img{height:48px}th,td{padding:6px 7px}input,select,button{padding:8px 10px}}
body{background:linear-gradient(180deg,#f7f5e8,#eef1dd) fixed}
.btn{box-shadow:0 2px 6px rgba(0,0,0,.08)}
p.so{margin:0 0 10px}
button.dl{color:#b3261e;border-color:#b3261e}
a.cn{color:#0b57d0;text-decoration:underline;font-weight:700}
.cr{max-width:1000px;margin:0 auto;padding:4px 16px 20px;text-align:center;font-size:12px;line-height:1.3;color:var(--n);opacity:.55}
@media print{.cr{display:none}}
#pasang{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#1b5e32;color:#fff;border:3px solid #d4a017;border-radius:16px;padding:12px 14px;font:700 16px/1.35 Arial,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3);align-items:center;gap:10px}
#pasang span{flex:1}#pasang button{font:inherit;border:0;border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer}
#pasang .y{background:#d4a017;color:#1b5e32}#pasang .n{background:transparent;color:#fff;font-size:20px;padding:8px 12px}

<script>
const API='https://script.google.com/macros/s/AKfycby2qrJeHOsFadPLwM2HAF6M4vXn1YKphD6luB8f0iwoWaVobixWusLpRsTxio2PWJhh/exec';
const $=id=>document.getElementById(id);
const e=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const DL=$('hl').src;
function cfgApply(c){
  if(!c)return;
  $('hj').textContent=c.guru||'Halaman Guru';
  if(c.sekolah)$('hs').textContent=c.sekolah;
  if(c.logo){const h=$('hl');h.onerror=()=>{h.onerror=null;h.src=DL};h.src=c.logo}
  document.title=$('hj').textContent+' - '+(c.judul||'Ruang Pembelajaran')+' '+$('hs').textContent;
  try{localStorage.setItem('cfg',JSON.stringify(c))}catch(x){}
}
try{cfgApply(JSON.parse(localStorage.getItem('cfg')))}catch(x){}
(async()=>{try{cfgApply((await(await fetch(API+'?a=init')).json()).cfg)}catch(x){}})();
let KOD='',R=[],I={},F='',G=[],M=[],BR=[],SO='d';
const cv=(a,b)=>String(a||'').localeCompare(String(b||''),'ms',{numeric:true});
const SF={d:()=>0,n:(a,b)=>cv(a.n,b.n),k:(a,b)=>cv(a.k,b.k)||cv(a.n,b.n),s:(a,b)=>cv(a.sub,b.sub)||cv(a.t,b.t)||cv(a.n,b.n)};
const bc=x=>x.st=='Selesai'||(x.st=='Diulang'&&x.m!=='');
const pc=x=>x.z?Math.round(x.m/x.z*100):0;
const av=a=>a.length?Math.round(a.reduce((s,x)=>s+pc(x),0)/a.length):0;
const grp=(a,f)=>{const o={};a.forEach(x=>(o[f(x)]=o[f(x)]||[]).push(x));return Object.entries(o)};
const call=async q=>(await fetch(API+'?'+new URLSearchParams({...q,kod:KOD}))).json();
function login(m){$('app').innerHTML=`<h2>Masuk</h2><p>${m||'Masukkan kod guru.'}</p><input id="kod" type="password" placeholder="Kod guru"> <button class="p" onclick="masuk()">Masuk</button>`}
async function masuk(){
  if($('kod'))KOD=$('kod').value;
  $('app').innerHTML='Memuatkan…';
  try{const d=await call({a:'guru'});if(d.err){KOD='';login('Kod salah. Cuba lagi.');return}R=d.r;I=d.i;show()}
  catch(x){login('Tidak dapat membaca data. Semak URL Apps Script dan deploy versi terbaharu.')}
}
function fd(ms){const p={};new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kuala_Lumpur',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'}).formatToParts(ms).forEach(x=>p[x.type]=x.value);const z=v=>String(v).padStart(2,'0');return z(p.day)+'/'+z(p.month)+'/'+p.year+' '+z(p.hour)+':'+p.minute+':'+p.second}
let RQ=[];
function reqs(){
  RQ=R.filter(x=>x.q&&x.st!='Diulang');
  if(!RQ.length)return '';
  return `<h2>Permintaan set semula (${RQ.length})</h2><div class="w"><table><tr><th>Nama</th><th>Kelas</th><th>Mata pelajaran</th><th>Set</th><th>Masa</th><th></th></tr>`+RQ.map((x,i)=>`<tr><td>${e(x.n)}</td><td>${e(x.k)}</td><td>${e(x.sub)}</td><td>${e(x.t)}</td><td>${fd(x.q)}</td><td><button class="p" onclick="lulus(${i})">Luluskan</button></td></tr>`).join('')+'</table></div>';
}
async function lulus(i){const x=RQ[i];try{await call({a:'reset',n:x.n,sub:x.sub,t:x.t});masuk()}catch(z){alert('Gagal. Cuba lagi.')}}
function show(){
  const subs=[...new Set(R.map(x=>x.sub))],rows=R.filter(x=>!F||x.sub==F).sort((a,b)=>(b.d||0)-(a.d||0)||cv(a.n+a.t,b.n+b.t)),done=rows.filter(x=>x.p==1&&x.m!=='');
  BR=rows;
  let h=`<div id="bar"><select onchange="F=this.value;show()"><option value="">Semua mata pelajaran</option>${subs.map(s=>`<option ${s==F?'selected':''}>${e(s)}</option>`).join('')}</select> <button onclick="masuk()">🔄 Muat semula</button> <button onclick="print()">🖨 Cetak</button></div>`;
  h+=reqs()+'<h2>Mengikut mata pelajaran</h2><div class="w"><table><tr><th>Mata pelajaran</th><th>Murid selesai</th><th>Purata (%)</th></tr>'+grp(done,x=>x.sub).map(([s,a])=>`<tr><td>${e(s)}</td><td>${a.length}</td><td>${av(a)}</td></tr>`).join('')+'</table></div>';
  G=grp(done,x=>x.sub+'|'+x.t);
  h+='<h2>Mengikut set</h2><div class="w"><table><tr><th>Mata pelajaran</th><th>Set</th><th>Selesai</th><th>Purata (%)</th><th>Tertinggi</th><th>Terendah</th><th>Analisis soalan</th></tr>'+G.map(([k,a],i)=>{const p=a.map(pc);return `<tr><td>${e(a[0].sub)}</td><td>${e(a[0].t)}</td><td>${a.length}</td><td>${av(a)}</td><td>${Math.max(...p)}</td><td>${Math.min(...p)}</td><td><button onclick="it(${i})">Lihat</button></td></tr><tr id="it${i}" hidden><td colspan="7"></td></tr>`}).join('')+'</table></div>';
  h+='<h2>Rekod murid</h2><p class="so"><select id="so" onchange="SO=this.value;tbl()" aria-label="Susun rekod murid">'+[['d','Terkini'],['n','Nama murid'],['k','Kelas'],['s','Mata pelajaran']].map(([v,t])=>`<option value="${v}" ${v==SO?'selected':''}>${t}</option>`).join('')+'</select></p><div id="rm"></div>';
  $('app').innerHTML=h;tbl();
}
function tbl(){
  M=[...BR].sort((a,b)=>SF[SO](a,b)||(b.d||0)-(a.d||0)||cv(a.n+a.t,b.n+b.t));
  $('rm').innerHTML='<div class="w"><table><tr><th>Tarikh dan Masa</th><th>Nama</th><th>Kelas</th><th>Mata pelajaran</th><th>Set</th><th>Percubaan</th><th>Markah</th><th>%</th><th>Status</th><th></th></tr>'+M.map((x,i)=>`<tr><td>${x.d?fd(x.d):'-'}</td><td>${bc(x)?`<a href="#" class="cn" title="Cetak soalan dan jawapan murid" onclick="cetak(${i});return false">🖨 ${e(x.n)}</a>`:e(x.n)}</td><td>${e(x.k)}</td><td>${e(x.sub)}</td><td>${e(x.t)}</td><td>${x.p}</td><td>${x.m!==''?x.m+' / '+x.z:'-'}</td><td>${x.m!==''?pc(x):'-'}</td><td>${e(x.st)}</td><td>${x.st=='Diulang'?'':`<button onclick="rs(${i})">Set semula</button>`+(x.st!='Selesai'?` <button class="dl" onclick="pd(${i})">Padam</button>`:'')}</td></tr>`).join('')+'</table></div>';
}

// Cetak soalan yang telah dijawab oleh seorang murid (hanya rekod berstatus Selesai)
function cetak(i){
  const x=M[i];
  if(!x||!bc(x))return;
  const q=I[x.sub+'|'+x.t]||[],j=String(x.j||'');
  if(!q.length){alert('Soalan untuk set "'+x.t+'" ('+x.sub+') tidak ditemui.\n\nSet ini mungkin telah dipadam atau namanya diubah dalam tab Senarai Set, atau Code.gs belum di-deploy versi terbaharu.');return}
  const L='ABCD';
  const body=q.map((s,n)=>{
    const a=j[n]&&L.includes(j[n])?j[n]:'-',ok=a==s.k;
    const op=(s.o||[]).map((t,k)=>{
      const c=L[k],pil=c==a,btl=c==s.k;
      return `<div class="o${pil?' p':''}${btl?' b':''}"><b>${c}.</b> ${e(t)} ${pil&&btl?'<span class="t">✔ Jawapan murid (betul)</span>':pil?'<span class="x">✘ Jawapan murid</span>':btl?'<span class="t">✔ Jawapan betul</span>':''}</div>`}).join('');
    const ringkas=s.o&&s.o.length?'':`<div class="o">Jawapan murid: <b>${a=='-'?'tiada':a}</b> &nbsp; Jawapan betul: <b>${e(s.k)}</b></div>`;
    return `<div class="q"><div class="s"><b>${n+1}.</b> ${e(s.s)} <span class="${ok?'t':'x'}">${ok?'✔':a=='-'?'(tidak dijawab)':'✘'}</span></div>${s.g?`<img src="${e(s.g)}" alt="">`:''}${op}${ringkas}</div>`}).join('');
  const w=window.open('','_blank');
  if(!w){alert('Pelayar menyekat tetingkap baharu. Benarkan pop-up untuk laman ini.');return}
  w.document.write(`<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><title>${e(x.n)} - ${e(x.t)}</title><style>
body{font:15px/1.45 Arial,Helvetica,sans-serif;color:#000;margin:0;padding:18px 24px}
.h{display:flex;align-items:center;gap:14px;border-bottom:3px solid #1b5e32;padding-bottom:10px;margin-bottom:12px}
.h img{height:56px}.h b{font-size:1.2em;color:#1b5e32}
table.i{border-collapse:collapse;margin-bottom:12px}table.i td{padding:3px 12px 3px 0}
.q{margin:0 0 12px;break-inside:avoid;page-break-inside:avoid}.s{font-weight:700}
.q img{display:block;max-height:160px;max-width:100%;margin:6px 0}
.o{margin:2px 0 2px 22px;padding:2px 6px;border:1px solid transparent;border-radius:5px}
.o.p{border-color:#000;background:#eee}.o.b{border-color:#1b5e32}
.t{color:#1b5e32;font-weight:700}.x{color:#b3261e;font-weight:700}
.pr{margin:0 0 12px}button{font:inherit;padding:8px 14px}
@media print{.pr{display:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{padding:0}}
</style></head><body>
<div class="pr"><button onclick="print()">🖨 Cetak</button></div>
<div class="h">${DL?`<img src="${DL}" alt="">`:''}<div><b>${e($('hs').textContent||'PPKI SMK Penangah')}</b><br>Soalan dan jawapan murid</div></div>
<table class="i">
<tr><td><b>Nama</b></td><td>${e(x.n)}</td><td><b>Kelas</b></td><td>${e(x.k)}</td></tr>
<tr><td><b>Mata pelajaran</b></td><td>${e(x.sub)}</td><td><b>Set</b></td><td>${e(x.t)}</td></tr>
<tr><td><b>Tarikh</b></td><td>${x.d?fd(x.d):'-'}</td><td><b>Markah</b></td><td>${x.m} / ${x.z} (${pc(x)}%)</td></tr>
<tr><td><b>Status</b></td><td>${e(x.st)}</td><td><b>Percubaan</b></td><td>${x.p}</td></tr>
</table>${body}</body></html>`);
  w.document.close();
  setTimeout(()=>{w.focus();w.print()},700);
}
function it(i){
  const r=$('it'+i),a=G[i][1][0],q=I[a.sub+'|'+a.t]||[];
  if(!r.hidden){r.hidden=true;return}
  r.firstChild.innerHTML='<table><tr><th>No</th><th>Soalan</th><th>Jawapan</th><th>Betul (%)</th></tr>'+q.map((x,n)=>{const p=x.n?Math.round(x.b/x.n*100):0;return `<tr><td>${n+1}</td><td>${e(x.s)}</td><td>${e(x.k)}</td><td class="${p<50?'lo':''}"><span class="bar ${p<50?'r':''}" style="width:${p}px"></span> ${p}% (${x.b}/${x.n})</td></tr>`}).join('')+'</table>';
  r.hidden=false;
}
async function rs(i){
  const x=M[i];
  if(!confirm('Set semula rekod '+x.n+' untuk set "'+x.t+'"? Rekod lama disimpan dan murid boleh mengulang set soalan ini.'))return;
  try{await call({a:'reset',n:x.n,sub:x.sub,t:x.t});masuk()}catch(z){alert('Gagal. Cuba lagi.')}
}
async function pd(i){
  const x=M[i];
  if(x.st=='Selesai'||x.st=='Diulang')return;
  if(!confirm('Pasti mahu padam percubaan ini?\n\n'+x.n+' - '+x.sub+' - '+x.t+'\n\nPadam ini kekal dan tidak boleh dipulihkan.'))return;
  try{const d=await call({a:'padam',n:x.n,sub:x.sub,t:x.t});if(d&&d.err){alert('Gagal: '+d.err);return}masuk()}catch(z){alert('Gagal. Cuba lagi.')}
}

<script>
// PWA: butang "Pasang" (Android/Chrome) + panduan iPhone (Safari)
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(()=>{
  const b=document.getElementById('pasang'),y=document.getElementById('py'),n=document.getElementById('pn'),t=document.getElementById('pt');
  const dipasang=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  let tolak=0;try{tolak=+localStorage.getItem('pasangTolak')||0}catch(x){}
  if(dipasang||Date.now()-tolak<7*864e5)return;
  let ev=null;
  n.onclick=()=>{b.style.display='none';try{localStorage.setItem('pasangTolak',Date.now())}catch(x){}};
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;b.style.display='flex'});
  y.onclick=async()=>{if(!ev)return;ev.prompt();await ev.userChoice;ev=null;b.style.display='none'};
  addEventListener('appinstalled',()=>{b.style.display='none'});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!/crios|fxios/i.test(navigator.userAgent)){
    t.innerHTML='📲 Untuk pasang: ketik <b>Kongsi</b> (⬆️) kemudian <b>Tambah ke Skrin Utama</b>';y.style.display='none';b.style.display='flex';
  }
})();
</script>
