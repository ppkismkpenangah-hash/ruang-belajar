<style>
:root{--n:#1b5e32;--g:#d4a017;--bg:#f6f4e6;--ok:#2e9e4f;--no:#d64545}
*{box-sizing:border-box}
body{margin:0;font:22px/1.4 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--n)}
header{width:calc(100% - 32px);max-width:748px;margin:16px auto 0;background:linear-gradient(135deg,#1b5e32,#3a9140);color:#fff;padding:16px 20px;border-radius:18px;display:flex;align-items:center;gap:16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
header img{height:64px;width:auto;max-height:none;margin:0;border-radius:0}
header .tx{display:flex;flex-direction:column;gap:3px}
header small{color:var(--g);font-size:.5em;font-weight:700;letter-spacing:.12em}
header b{font-size:1.5em;line-height:1.1;text-transform:uppercase}
header i{font-style:normal;font-size:.75em;font-weight:400}
main{max-width:780px;margin:0 auto;padding:16px}
h2{margin:8px 0}
.btn{display:block;width:100%;min-height:68px;margin:12px 0;border:3px solid var(--n);border-radius:18px;background:#fff;color:var(--n);font:inherit;font-weight:700;padding:12px 16px;text-align:left;cursor:pointer}
.btn:focus-visible,select:focus-visible{outline:4px solid var(--g);outline-offset:2px}
.p,.sel{background:var(--n);color:#fff}
.p{text-align:center}
.btn:disabled{opacity:.35}
.row{display:flex;gap:10px;margin:12px 0}
.row .btn{margin:0}.row .t{flex:1}.row .c{width:84px;text-align:center;padding:0;font-size:1.5em}
select{width:100%;min-height:64px;margin:10px 0;font:inherit;border:3px solid var(--n);border-radius:14px;padding:8px;background:#fff;color:var(--n)}
.bar{height:16px;background:#ddd;border-radius:9px;overflow:hidden;border:2px solid var(--n)}
.bar i{display:block;height:100%;width:100%;background:var(--g);transition:width 1s linear}
img{display:block;max-width:100%;max-height:260px;margin:10px auto;border-radius:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:14px 0}
.g button{min-height:84px;border:3px solid;border-radius:16px;font:inherit;font-weight:700;color:#fff;cursor:pointer}
.ok{background:var(--ok);border-color:#1f7a3a}.no{background:var(--no);border-color:#a82e2e}
.btn small{font-weight:400}
.sp{display:inline-block;margin-left:8px;padding:4px 10px;border-radius:12px;cursor:pointer;font-weight:400;vertical-align:middle;-webkit-tap-highlight-color:transparent}.sp:hover{background:rgba(212,160,23,.25)}.sp:focus-visible{outline:4px solid var(--g);outline-offset:1px}
.btn.p .sp:hover{background:rgba(255,255,255,.25)}
.row.k .t{border-color:var(--c);border-left-width:14px;background:var(--t)}.row.k .c{border-color:var(--c)}
.cds{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.cd{display:flex;flex-direction:column;border:3px solid var(--c);border-radius:22px;background:var(--t);overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.1);transition:box-shadow .2s}
.cm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:170px;border:0;background:none;font:inherit;font-weight:700;color:var(--c);padding:20px 10px 12px;cursor:pointer;text-align:center}
.cm .ic{font-size:3.6em;line-height:1}
.cs{border:0;border-top:3px solid var(--c);background:#fff;font:inherit;font-size:1.5em;padding:10px;cursor:pointer}
.btn:active,.cm:active{transform:scale(.985)}
.btn,.cm{transition:transform .12s,background .2s}
.row.on .btn{background:#fff2b8!important;border-color:var(--g)!important}
.row.on .c,.cd.on .cs{background:var(--g)!important}
.cd.on{box-shadow:0 0 0 6px rgba(212,160,23,.55)}
.sp.on{background:rgba(212,160,23,.5)}
.mi{display:inline-grid;grid-template-columns:auto auto;gap:0 2px;font-size:.55em;line-height:1.05;vertical-align:middle}.mi i{font-style:normal}
@media(max-width:600px){.cm{min-height:140px}.cm .ic{font-size:3em}.cds{gap:10px}}
@media(prefers-reduced-motion:reduce){.btn,.cm,.cd{transition:none!important}.btn:active,.cm:active{transform:none}}
.clk{font-size:1.8em;font-weight:700;text-align:center;margin-bottom:6px}
.end{text-align:center;padding:40px 8px}.end b{font-size:2.4em;display:block}
@media(max-width:600px){body{font-size:18px}header{padding:12px;gap:12px;font-size:.9em}header img{height:48px}main{padding:12px}.btn{min-height:58px;padding:10px 12px;margin:10px 0;border-radius:16px}.row{gap:8px;margin:10px 0}.row .c{width:64px}select{min-height:54px}img{max-height:200px}.g{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}.g button{min-height:68px}.clk{font-size:1.5em}.end{padding:24px 4px}}
@media(max-width:380px){body{font-size:16px}.btn{min-height:54px}.row .c{width:58px}}
@media(max-height:480px) and (orientation:landscape){.btn{min-height:50px;margin:6px 0}.row{margin:6px 0}img{max-height:140px}}
body{background:linear-gradient(180deg,#f7f5e8,#eef1dd) fixed}
.btn{box-shadow:0 2px 6px rgba(0,0,0,.08)}
.slip{display:none}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:12mm}body{background:#fff!important;font-size:12px;color:#000}body>header,#app>*:not(.slip){display:none!important}main{max-width:none;padding:0}.slip{display:block}
.slip .sh{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1b5e32,#3a9140);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px}.slip .sh img{height:52px;max-height:none;margin:0;border-radius:0}.slip .sh small{display:block;color:var(--g);font-weight:700;letter-spacing:.1em;font-size:9px}.slip .sh b{display:block;font-size:18px;text-transform:uppercase;line-height:1.15}.slip .sh i{font-style:normal;font-size:12px}
.slip h2{font-size:16px;margin:10px 0 6px;border-left:6px solid var(--g);padding-left:8px}
.slip table{width:100%;border-collapse:collapse;margin-bottom:8px}.slip th,.slip td{border:1px solid #bbb;padding:5px 7px;text-align:left;vertical-align:top;overflow-wrap:anywhere}.slip th{background:var(--n);color:#fff}.slip .kv th{width:26%;background:#e8f1ea;color:var(--n)}
.slip .qt th:first-child,.slip .qt td:first-child,.slip .qt th:last-child,.slip .qt td:last-child{white-space:nowrap;width:1%;text-align:center}.slip tr{break-inside:avoid}.slip tr.b td{background:#e6f4ea}.slip tr.s td{background:#fbe9e9}.slip .mk{font-size:15px;font-weight:700;margin:6px 0}}
a.btn{text-decoration:none;display:block}
.s0{color:#000}.s1{color:#c62828}.sel .s0,.p .s0{color:#fff}.sel .s1,.p .s1{color:#ffd54f}
.cr{max-width:780px;margin:0 auto;padding:4px 16px 20px;text-align:center;font-size:12px;line-height:1.3;color:var(--n);opacity:.55}
@media print{.cr{display:none}}
#pasang{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#1b5e32;color:#fff;border:3px solid #d4a017;border-radius:16px;padding:12px 14px;font:700 16px/1.35 Arial,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3);align-items:center;gap:10px}
#pasang span{flex:1}#pasang button{font:inherit;border:0;border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer}
#pasang .y{background:#d4a017;color:#1b5e32}#pasang .n{background:transparent;color:#fff;font-size:20px;padding:8px 12px}
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity .5s}
#splash.x{opacity:0;pointer-events:none}
#splash img{width:min(52vw,230px);height:auto;animation:sp 1.6s ease-in-out infinite}
#splash h1{margin:0;font-size:clamp(1.25em,5.2vw,1.9em);letter-spacing:.04em;color:var(--n)}
#splash p{margin:0;color:var(--n);opacity:.7}
@keyframes sp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){#splash img{animation:none}}

  nsay(NK[nc].t,()=>{
    if(!auto||my!=at)return;
    if(nc<NK.length-1){nc++;nv();pa()}else{auto=false;nv()}
  });
}
function sets(i){
  sub=subs(D.set)[i];
  v(`<p>Pilih Set Soalan: ${sp('Pilih set soalan')}</p>`+D.set.filter(x=>x.sub==sub).map(x=>{const pd=x.pdf||x.gdoc,nx=LT&&(pd||!(x.of&&ld('oq'+x.i,null)));return mr(nx?"say('Set ini perlu internet')":`${pd?'pdfv':'who'}(${x.i})`,(nx?'🌐 ':pd?'📄 ':'📝 ')+sk(x.t+(x.f?' (Tingkatan '+x.f+')':'')),x.t+(x.f?' Tingkatan '+x.f:''),sub)}).join('')+mr('kuiz()','⬅ Kembali','Kembali'));
}
// Set jenis PDF atau Google Docs (ujian praktikal kertas): paparan dokumen, tiada kuiz dan tiada rekod markah
function pdfv(i){
  const st=D.set.find(x=>x.i==i)||{},gd=!!st.gdoc,id=encodeURIComponent(st.gdoc||st.pdf||''),pv=gd?`https://docs.google.com/document/d/${id}/preview`:`https://drive.google.com/file/d/${id}/preview`,dl=gd?`https://docs.google.com/document/d/${id}/export?format=pdf`:`https://drive.google.com/uc?export=download&id=${id}`,si=subs(D.set).indexOf(sub);
  v(`<h2>${e(st.t)}</h2><a class="btn p" href="${dl}" target="_blank" rel="noopener">⬇ Simpan / Cetak PDF</a><iframe src="${pv}" title="${e(st.t)}" style="width:100%;height:70vh;border:3px solid var(--n);border-radius:14px;background:#fff"></iframe><button class="btn" onclick="sets(${si})">⬅ Kembali</button>`);
  say(st.t);
}
function who(i){
  S=i;const ns=[...new Set(D.m.map(x=>x.n))].sort(),sd0=new Set(snGet(i));
  const op1=n=>`<option value="${e(n)}">${e(n)}${sd0.has(n)?' ⭐':''}</option>`;
  v(`<h2>Pilih nama dan kelas</h2><select id="n" onchange="nm()"><option value="">${sd0.size?'Pilih nama (⭐ = sudah menjawab)':'Pilih nama'}</option>${ns.map(op1).join('')}</select><select id="k"><option value="">Pilih kelas</option></select><button class="btn p" onclick="go()">Teruskan ➡</button><button class="btn" onclick="sets(${subs(D.set).indexOf(sub)})">⬅ Kembali</button>`);
  // Segar semula daripada rekod Sheet (pelayan ialah sumber tepat; reset guru turut dipadam daripada tanda)
  const st=D.set.find(x=>x.i==i)||{};
  if(!LT&&navigator.onLine&&!st.pdf&&!st.gdoc)api({a:'selesai',i}).then(r=>{
    if(!r||!Array.isArray(r.n))return;
    sv('sn'+i,r.n);
    const n=$('n');if(S!==i||!n)return;
    const sd=new Set(snGet(i));
    [...n.options].forEach((o,x)=>{
      if(!x){o.textContent=sd.size?'Pilih nama (⭐ = sudah menjawab)':'Pilih nama';return}
      o.value=o.value;o.textContent=o.value+(sd.has(o.value)?' ⭐':'');
    });
  }).catch(()=>{});
}
function nm(){const ks=[...new Set(D.m.filter(x=>x.n==$('n').value).map(x=>x.k))];$('k').innerHTML=(ks.length==1?'':'<option value="">Pilih kelas</option>')+ks.map(k=>`<option>${e(k)}</option>`).join('')}
async function go(){
  kelas=$('k').value;nama=$('n').value;
  if(!kelas||!nama){say('Pilih kelas dan nama dahulu');alert('Pilih kelas dan nama dahulu');return}
  v('Memuatkan soalan…');
  const st=D.set.find(x=>x.i==S)||{},oc=st.of?ld('oq'+S,null):null;
  if(LT||!navigator.onLine){if(sudahJawab(S,nama)){dah();return}if(oc){luarMula(oc)}else{alert('Set ini perlu internet.');who(S)}return}
  try{
    const r=await api({a:'start',i:S,n:nama,k:kelas});
    OQ=false;sv('od',ld('od',[]).filter(z=>z!=S+'|'+nama));
    if(r.d){dah(r);return}
    Q=fixQ(r.q);const sj=String(r.j||'');J=Q.map((_,i)=>'ABCD'.includes(sj[i]||'x')?sj[i]:'-');mula=r.m;off=r.now-Date.now();dur=r.dur;cur=0;op=new Set();
    J.forEach((x,i)=>{if(x!='-')op.add(i)});
    timer=setInterval(tick,1000);quiz();
  }catch(x){if(sudahJawab(S,nama)){dah();return}if(oc){luarMula(oc)}else{alert('Tiada sambungan internet. Cuba lagi.');who(S)}}
}
// Kuiz latihan luar talian: soalan dari simpanan, masa undur dalam telefon, jawapan dihantar kemudian
function luarMula(c){
  if(sudahJawab(S,nama)){dah();return}
  OQ=true;Q=fixQ(c.q);J=Q.map(()=>'-');mula=Date.now();off=0;dur=c.dur;cur=0;op=new Set();
  timer=setInterval(tick,1000);quiz();
}
const rem=()=>mula+dur-(Date.now()+off);
function quiz(){
  op.add(cur);const q=Q[cur],N=Q.length;
  let h=`<div class="clk" id="clk"></div><div class="bar"><i id="bar"></i></div><p><b>Soalan ${cur+1} daripada ${N}</b></p>`+skBtn('q')+qrBtn();
  if(q.g)h+=`<img src="${q.g}" alt="">`;
  h+=`<div class="row"><button class="btn t" onclick="qsay(Q[${cur}].s)">${sk(q.s)}</button><button class="btn c" onclick="qsay(Q[${cur}].s)">🔊</button></div>`;
  'ABCD'.split('').forEach((L,k)=>{
    if(q.o[k]==='')return;const s=J[cur]==L;
    h+=`<div class="row"><button class="btn t ${s?'sel':''}" onclick="qsay('${L}. '+Q[${cur}].o[${k}])">${L}. ${sk(q.o[k])} 🔊</button><button class="btn c ${s?'sel':''}" aria-label="Pilih ${L}" onclick="pick('${L}')">${s?'✔':'○'}</button></div>`});
  h+=`<div class="row"><button class="btn t" ${cur?'':'disabled'} onclick="mv(-1)">⬅ Kembali</button>${J.every(x=>x!='-')?'<button class="btn t p" onclick="ask()">📤 Hantar</button>':`<button class="btn t p" ${cur<N-1?'':'disabled'} onclick="mv(1)">Seterusnya ➡</button>`}</div>`;
  if(op.size==N)h+='<button class="btn" onclick="list()">📋 Senarai Soalan</button>';
  pg='q';v(h+'<div id="hz"></div>');hk='';tick();
}
function mv(d){cur+=d;quiz()}
function pick(L){J[cur]=L;if(!OQ)api({a:'save',i:S,n:nama,j:'J'+J.join('')}).catch(()=>{});quiz()}
function list(){
  v(`<div class="clk" id="clk"></div><div class="bar"><i id="bar"></i></div><h2>Senarai Soalan</h2><button class="btn" onclick="say('Hijau tanda betul bermaksud sudah dijawab. Merah tanda seru bermaksud belum dijawab.')">🔊 Hijau ✔ = sudah dijawab<br>Merah ❗ = belum dijawab</button><div class="g">`+Q.map((q,i)=>`<button class="${J[i]=='-'?'no':'ok'}" onclick="cur=${i};quiz()">${i+1} ${J[i]=='-'?'❗':'✔'}</button>`).join('')+'</div><button class="btn" onclick="quiz()">⬅ Kembali ke soalan</button><div id="hz"></div>');pg='l';hk='';tick();
}
function tick(){
  const r=rem();
  if($('bar'))$('bar').style.width=Math.max(0,r/dur*100)+'%';
  if($('clk')){const q=Math.max(0,Math.ceil(r/1000));$('clk').textContent='⏱ '+String(Math.floor(q/60)).padStart(2,'0')+':'+String(q%60).padStart(2,'0')}
  if(r<=0){submit();return}
  const z=$('hz');if(!z)return;
  const left=J.filter(x=>x=='-').length;
  const k=left?'a'+left:'c'+pg;
  if(k==hk)return;hk=k;
  z.innerHTML=left?`<button class="btn" onclick="say('Masih ada ${left} soalan belum dijawab')">❗ Masih ada ${left} soalan belum dijawab 🔊</button>`:(pg=='l'?'<button class="btn p" onclick="ask()">📤 Hantar</button>':'');
}
function ask(){
  const t='Adakah anda mahu hantar, atau semak semula?';
  v(`<div class="end"><b>🤔</b><h2>${t}</h2><button class="btn p" onclick="submit()">✅ Hantar</button><button class="btn" onclick="list()">🔍 Semak semula</button></div>`);say(t);
}
async function submit(){
  if(busy)return;busy=true;
  const oc=ld('oq'+S,null),kk=oc&&oc.k&&oc.k.length==Q.length?oc.k:null;
  // Selesaikan di peranti: kira markah dan papar semakan serta-merta, hantar ke Sheet apabila ada internet
  const luarSiap=()=>{
    const st=D.set.find(x=>x.i==S)||{},p=ld('op',[]);
    p.push({i:S,n:nama,k:kelas,j:J.join(''),m:mula,t:st.t,sub:st.sub,q:Q,s:1});sv('op',p);
    const od=ld('od',[]);od.push(S+'|'+nama);sv('od',od);OQ=false;
    let m=0;Q.forEach((_,i)=>{if(J[i]==kk[i])m++});
    rev({m,z:Q.length,k:kk});syn();
  };
  const tiadaNet=()=>{
    if(rem()<=0)clearInterval(timer);busy=false;
    const t='Tiada internet. Jawapan anda disimpan. Sambung internet, kemudian tekan Cuba lagi.';
    v(`<div class="end"><b>📴</b><h2>Tiada internet</h2><p>Jawapan anda disimpan. Sambung internet, kemudian tekan Cuba lagi.</p><button class="btn p" onclick="submit()">🔄 Cuba lagi</button><button class="btn" onclick="list()">🔍 Semak semula</button></div>`);say(t);
  };
  if(OQ||!navigator.onLine){
    if(kk){luarSiap();return}
    if(OQ){ // salinan lama tanpa jawapan: simpan dan tunggu internet
      const st=D.set.find(x=>x.i==S)||{},p=ld('op',[]);
      p.push({i:S,n:nama,k:kelas,j:J.join(''),m:mula,t:st.t,sub:st.sub,q:Q});sv('op',p);
      const od=ld('od',[]);od.push(S+'|'+nama);sv('od',od);OQ=false;
      fin('Jawapan disimpan. Markah dan semakan jawapan akan muncul di halaman utama apabila internet kembali.');syn();return;
    }
    tiadaNet();return;
  }
  try{const r=await api({a:'submit',i:S,n:nama,j:'J'+J.join('')});r.k?rev(r):fin('Selesai, terima kasih')}
  catch(x){if(kk){luarSiap()}else{tiadaNet()}}
}
let RV=[];
function slip(r){
  const st=D.set.find(x=>x.i==S)||{},oi=(c,q)=>'ABCD'.includes(c)?c+'. '+q.o['ABCD'.indexOf(c)]:'tiada';
  const tk=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kuala_Lumpur',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()).replace(',','');
  const pr=r.z?Math.round(r.m/r.z*100):0,pg0=document.querySelector('header small');
  return `<div class="slip"><div class="sh"><img src="${e($('hl').src)}" alt=""><div>${pg0?'<small>'+e(pg0.textContent)+'</small>':''}<b>${e($('hs').textContent)}</b><i>${e($('hj').textContent)}</i></div></div>
<h2>Slip Keputusan</h2><table class="kv"><tr><th>Nama</th><td>${e(nama)}</td><th>Kelas</th><td>${e(kelas)}</td></tr><tr><th>Mata pelajaran</th><td>${e(sub)}</td><th>Set</th><td>${e(st.t||'')}</td></tr><tr><th>Tarikh dan masa</th><td colspan="3">${tk}</td></tr></table>
<div class="mk">Markah: ${r.m} / ${r.z} (${pr}%)</div>
<table class="qt"><tr><th>No</th><th>Soalan</th><th>Jawapan murid</th><th>Jawapan betul</th><th></th></tr>${Q.map((q,i)=>{const a=J[i],k=r.k[i],ok=a==k;return `<tr class="${ok?'b':'s'}"><td>${i+1}</td><td>${e(q.s)}</td><td>${e(oi(a,q))}</td><td>${e(oi(k,q))}</td><td>${ok?'✔':'✘'}</td></tr>`}).join('')}</table></div>`;
}
function rev(r){
  clearInterval(timer);busy=false;RV=[];mk();
  try{if(r.k&&Q.length&&nama&&S!==undefined){const rs=ld('rs',{});rs[S+'|'+nama]={q:Q,j:J.join(''),m:r.m,z:r.z,k:r.k};sv('rs',rs)}}catch(x){}
  const m=r.m,z=r.z,pr=z?m/z*100:0,st=pr>=80?3:pr>=50?2:1,oi=(c,q)=>'ABCD'.includes(c)?q.o['ABCD'.indexOf(c)]:'';
  let h=`<div class="end"><b>${'⭐'.repeat(st)}</b><h2>Markah anda: ${m} / ${z}</h2><p>${st==3?'Syabas! Teruskan usaha.':'Lihat soalan yang salah, dan cuba lagi nanti.'}</p><button class="btn" onclick="say('Markah anda ${m} daripada ${z}')">🔊 Dengar markah</button><button class="btn" onclick="print()">🖨 Cetak</button></div>`;
  Q.forEach((q,i)=>{
    const a=J[i],k=r.k[i],ok=a==k;
    RV[i]='Soalan '+(i+1)+'. '+q.s+'. '+(ok?'Jawapan anda betul. '+k+'. '+oi(k,q):'Jawapan anda '+(a=='-'?'tiada':a+'. '+oi(a,q))+'. Jawapan betul ialah '+k+'. '+oi(k,q));
    h+=`<button class="btn" style="border-color:${ok?'#1f7a3a':'#a82e2e'}" onclick="say(RV[${i}])">${ok?'✔':'✘'} ${i+1}. ${sk(q.s)} 🔊<br><small>Jawapan anda: ${a=='-'?'tiada':a+'. '+sk(oi(a,q))}${ok?'':'<br>Jawapan betul: '+k+'. '+sk(oi(k,q))}</small></button>`;
  });
  v(h+'<button class="btn p" onclick="home()">Kembali ke halaman utama</button>'+slip(r));say('Markah anda '+m+' daripada '+z);
}
let RVD=null;
// Lihat semula markah dan jawapan set yang sudah dijawab (hanya set yang membenarkan semakan; ujian rasmi tiada)
function lihatSemak(){
  const d=RVD;if(!d)return;
  Q=fixQ(d.q);J=String(d.j||'').split('').map(c=>'ABCD'.includes(c)?c:'-');
  rev({m:d.m,z:d.z,k:d.k});
}
function dah(r){
  clearInterval(timer);busy=false;mk();const t='Set soalan ini sudah dijawab';
  RVD=r?((r.k&&r.q)?r:null):(ld('rs',{})[S+'|'+nama]||null); // dalam talian: ikut pelayan; luar talian: salinan pada peranti
  if(r&&RVD){try{const rs=ld('rs',{});rs[S+'|'+nama]={q:fixQ(RVD.q),j:String(RVD.j||''),m:RVD.m,z:RVD.z,k:RVD.k};sv('rs',rs)}catch(x){}} // simpan salinan pada peranti supaya semakan boleh dilihat luar talian
  const bt=RVD?'<button class="btn p" onclick="lihatSemak()">📋 Lihat markah dan jawapan</button>':'';
  v(`<div class="end"><b>🌟</b><h2>${t}</h2>${bt}<p>Mahu cuba lagi? Minta Cikgu set semula.</p><button class="btn" onclick="wa()">💬 Minta melalui WhatsApp</button><button class="btn" onclick="mt()">🔔 Minta dalam aplikasi</button><p id="ms"></p><button class="btn p" onclick="home()">Kembali ke halaman utama</button></div>`);say(t+(RVD?'. Anda boleh melihat markah dan jawapan.':'')+'. Mahu cuba lagi? Minta Cikgu set semula.');
}
function wa(){
  const st=D.set.find(x=>x.i==S);
  const m=`Salam sejahtera Cikgu. Saya ${nama} (${kelas}) mohon set semula set soalan "${st?st.t:''}" (${sub}). Terima kasih.`;
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(m),'_blank');
}
async function mt(){
  try{const r=await api({a:'minta',i:S,n:nama});const t=r.dup?'Permintaan anda sudah ada. Sila tunggu Cikgu.':'Permintaan sudah dihantar. Sila tunggu Cikgu.';$('ms').textContent=t;say(t)}
  catch(x){$('ms').textContent='Tiada sambungan internet. Cuba lagi.'}
}
function fin(t){
  clearInterval(timer);busy=false;mk();
  v(`<div class="end"><b>🌟</b><h2>${e(t)}</h2><button class="btn p" onclick="home()">Kembali ke halaman utama</button></div>`);say(t);
}
home();
</script><div id="pasang"><span id="pt">📲 Pasang aplikasi ini di telefon anda</span><button class="y" id="py">Pasang</button><button class="n" id="pn" aria-label="Tutup">✕</button></div>
<script>
// PWA: butang "Pasang" (Android/Chrome) + panduan iPhone (Safari)
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(()=>{
  const b=document.getElementById('pasang'),y=document.getElementById('py'),n=document.getElementById('pn'),t=document.getElementById('pt');
  const dipasang=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  let tolak=0;try{tolak=+localStorage.getItem('pasangTolak')||0}catch(x){}
  if(dipasang||Date.now()-tolak<7*864e5)return;
  let ev=null;
  n.onclick=()=>{b.style.display='none';try{localStorage.setItem('pasangTolak',Date.now())}catch(x){}};
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;b.style.display='flex'});
  y.onclick=async()=>{if(!ev)return;ev.prompt();await ev.userChoice;ev=null;b.style.display='none'};
  addEventListener('appinstalled',()=>{b.style.display='none'});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!/crios|fxios/i.test(navigator.userAgent)){
    t.innerHTML='📲 Untuk pasang: ketik <b>Kongsi</b> (⬆️) kemudian <b>Tambah ke Skrin Utama</b>';y.style.display='none';b.style.display='flex';
  }
})();
</script>
